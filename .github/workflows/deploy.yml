name: Deploy to production
# מופעל ידנית בלבד: GitHub -> Actions -> "Deploy to production" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Stamp version
        run: echo "$(git rev-parse --short HEAD) $(date -u '+%Y-%m-%d %H:%M UTC')" > private/VERSION

      - name: Check FTP connection (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\"; cls -1; bye" | tee /tmp/root.txt
          grep -q "public_html" /tmp/root.txt || { echo "::error::לא נמצאה תיקיית public_html בשורש חשבון ה-FTP. יש לוודא שתיקיית הבית של החשבון היא תיקיית הבית הראשית."; exit 1; }

      - name: Upload (no deletions, config and data are never touched)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror -R --only-newer --verbose --exclude-glob config.php --exclude-glob installed.flag --exclude-glob '*.gitkeep' private private;
            mirror -R --only-newer --verbose --exclude-glob '*.gitkeep' public_html public_html;
            site chmod 700 private/sessions;
            site chmod 700 private/storage;
            bye"

      - name: Remove setup.php after first install
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          OPEN="set ftp:ssl-force true; set ftp:ssl-protect-data true; open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";"
          if lftp -e "$OPEN cls -1 private; bye" | grep -q "installed.flag"; then
            lftp -e "$OPEN rm -f public_html/setup.php; bye" && echo "setup.php removed"
          else
            echo "not installed yet - keeping setup.php"
          fi
